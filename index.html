<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf1">
<title>திறன் வழிகாட்டி | Thiran Vazhikaatti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#202044;--muted:#666783;--bg:#f6f5ff;--card:#fff;--line:#e9e6fa;--purple:#6c4cf1;--pink:#ff5ca8;--blue:#31a9ed;--green:#13b98b;--orange:#ffad42;--shadow:0 12px 35px rgba(58,43,125,.09);box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:18px}
body{margin:0;background:radial-gradient(circle at 5% 0%,#eee9ff 0,transparent 30%),radial-gradient(circle at 95% 15%,#ffeaf4 0,transparent 25%),var(--bg);color:var(--ink);font:400 16px/1.65 "Hind Madurai",system-ui,sans-serif}
button,input{font:inherit}
.wrap{width:min(1050px,100%);margin:auto;padding:22px 20px 42px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#4e3bb5;font-family:Poppins,"Hind Madurai",sans-serif;font-size:14px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#a36bff);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 7px 18px #7555e544}
.lang{display:flex;background:#fff;padding:4px;border:1px solid var(--line);border-radius:99px;box-shadow:0 4px 14px #3020600c}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:700}
.lang button[aria-pressed=true]{background:var(--purple);color:white;box-shadow:0 4px 12px #6c4cf155}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(24px,5vw,48px);color:white;background:linear-gradient(115deg,#5539d5 0%,#8055ef 55%,#c45bce 100%);box-shadow:0 18px 40px #6848d533}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff13;pointer-events:none}
.hero:before{width:260px;height:260px;right:-55px;top:-100px}
.hero:after{width:180px;height:180px;right:150px;bottom:-125px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff55;background:#ffffff19;padding:5px 12px;border-radius:99px;font-size:14px;font-weight:700}
h1{font:800 clamp(29px,5vw,46px)/1.2 Poppins,"Hind Madurai",sans-serif;margin:18px 0 10px;max-width:720px;letter-spacing:-1px}
.sub{margin:0;max-width:690px;color:#f5efff;font-size:17px}
.hero-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
.hero-pill{background:#ffffff20;border:1px solid #ffffff45;border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600}
.section-title{font:700 20px Poppins,"Hind Madurai",sans-serif;margin:28px 0 12px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,25px);box-shadow:var(--shadow)}
.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:10px;color:#35335f}
.legend-icon{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:6px;background:#f0edff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer;background:#fbfaff;color:#565574;font-size:14px;line-height:1.35;transition:.18s}
.chips label:hover{border-color:#b8a9ff;background:#f5f1ff}
.chips input:checked+label{background:#eee9ff;color:#5439ce;border-color:#8068f2;font-weight:700;box-shadow:inset 0 0 0 1px #8068f2}
.chips input:focus-visible+label{outline:3px solid var(--orange);outline-offset:2px}
.tools{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.search-wrap{position:relative;flex:1}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px}
#search{width:100%;border:1.5px solid var(--line);border-radius:13px;background:#fbfaff;padding:11px 14px 11px 42px;outline:none;color:var(--ink)}
#search:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6c4cf122}
.reset{border:0;border-radius:13px;background:#fff0f6;color:#c43e7b;padding:11px 15px;font-weight:700;cursor:pointer;white-space:nowrap}
.reset:hover{background:#ffe2ef}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 2px 13px}
#count{font:700 19px Poppins,"Hind Madurai",sans-serif;margin:0}
.hint{font-size:13px;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 7px 24px #33206e0a;display:flex;flex-direction:column;min-width:0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.card-icon{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#eeeaff,#fceaff)}
.card h2{font:700 17px/1.4 Poppins,"Hind Madurai",sans-serif;margin:1px 0 0;color:#29264e}
.badge{display:inline-flex;align-self:flex-start;background:#e4fbf3;color:#07845f;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:9px}
.who{margin:0 0 8px;font-weight:700;color:#4c4970;font-size:14px}
.card p{margin:0 0 10px}
.description{color:#555473}
.how{color:#6c4cf1;background:#f6f3ff;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:auto!important}
.go{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;background:linear-gradient(100deg,#6548e9,#9560ee);color:white;text-decoration:none;font-weight:700;padding:11px 16px;border-radius:12px;box-shadow:0 6px 15px #7555e533;transition:.2s}
.go:hover{filter:brightness(1.06);transform:translateY(-1px)}
.go:focus-visible,.lang button:focus-visible,.reset:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.empty{grid-column:1/-1;text-align:center;background:white;border:1px dashed #c9bfff;border-radius:20px;padding:30px 18px;color:var(--muted)}
.empty-icon{font-size:35px;display:block;margin-bottom:8px}
footer{margin-top:32px;background:#29234f;color:#e9e5ff;border-radius:20px;padding:20px 22px;font-size:14px}
.cred{margin:12px 0 0;text-align:center;color:#77738f;font-size:13px}
@media(max-width:760px){.filter-grid{grid-template-columns:1fr;gap:16px}.list{grid-template-columns:1fr}.wrap{padding:14px 13px 30px}.top{margin-bottom:15px}.hero{border-radius:22px}.section-title{margin-top:22px}.card{padding:17px}}
@media(max-width:420px){body{font-size:15px}.brand{font-size:12px}.brand-mark{width:36px;height:36px}.lang button{padding:7px 10px;font-size:13px}.hero{padding:23px 19px}h1{font-size:29px}.sub{font-size:15px}.tools{align-items:stretch;flex-direction:column}.reset{width:100%}.results-head{align-items:flex-start;flex-direction:column;gap:2px}.hint{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

  <p class="cred" id="cred"></p>
</div>

var st={lang:"ta",reg:0,lv:2,ar:0,search:""};
try{var saved=localStorage.getItem("tv-lang");if(saved==="en"||saved==="ta")st.lang=saved}catch(e){}
function $(id){return document.getElementById(id)}
function chips(name,labels,cur){return labels.map(function(label,i){return '<input type="radio" name="'+name+'" id="'+name+i+'" value="'+i+'"'+(i===cur?' checked':'')+'><label for="'+name+i+'">'+label+'</label>'}).join("")}
function fieldIcon(ar){return ({1:"⚡",2:"💻",3:"🩺",4:"🌾",5:"🧵",6:"🏛️",7:"🚀"})[ar]||"✨"}
function render(){
 var t=T[st.lang];document.documentElement.lang=st.lang;
 $("mark").textContent=t.mark;$("eyebrow").textContent=st.lang==="ta"?"உங்கள் எதிர்காலத்தைத் தேர்ந்தெடுங்கள்":"YOUR FUTURE STARTS HERE";
 $("h1").textContent=t.h1;$("sub").textContent=t.sub;$("foot").textContent=t.foot;$("cred").textContent=t.cred;
 $("l1").textContent=t.l1;$("l2").textContent=t.l2;$("l3").textContent=t.l3;
 $("filterTitle").textContent=st.lang==="ta"?"✨ உங்களுக்கான வாய்ப்புகளைத் தேடுங்கள்":"✨ Find your path";
 $("pill1").textContent=st.lang==="ta"?"🎯 வாய்ப்புகளைக் கண்டறியுங்கள்":"🎯 Explore opportunities";
 $("pill2").textContent=st.lang==="ta"?"🌱 எதிர்காலத்தை உருவாக்குங்கள்":"🌱 Build your future";
 $("search").placeholder=st.lang==="ta"?"பயிற்சி, திட்டம் அல்லது திறனைத் தேடுங்கள்...":"Search courses, schemes or skills...";
 $("search").value=st.search;
 $("reset").textContent=st.lang==="ta"?"↺ மீட்டமை":"↺ Reset filters";
 $("hint").textContent=st.lang==="ta"?"வடிகட்டிகளை மாற்றி மேலும் வாய்ப்புகளைப் பாருங்கள்":"Adjust filters to discover more options";
 $("c1").innerHTML=chips("reg",t.reg,st.reg);$("c2").innerHTML=chips("lv",t.lv,st.lv);$("c3").innerHTML=chips("ar",t.ar,st.ar);
 $("bta").setAttribute("aria-pressed",st.lang==="ta");$("ben").setAttribute("aria-pressed",st.lang==="en");
 var tn=st.reg===0,lvl=st.lv+1,term=st.search.trim().toLocaleLowerCase();
 var r=P.filter(function(p){
   if(!(lvl>=p.mi&&(tn||!p.tn)&&(st.ar===0||p.ar.indexOf(st.ar)>-1)))return false;
   if(!term)return true;
   return p[st.lang].join(" ").toLocaleLowerCase().indexOf(term)>-1;
 });
 r.sort(function(a,b){return (tn?(b.tn||0)-(a.tn||0):0)||a.mi-b.mi});
 $("count").textContent=st.lang==="ta"?r.length+" வாய்ப்புகள் உங்களுக்காக":r.length+(r.length===1?" opportunity for you":" opportunities for you");
 $("list").innerHTML=r.length?r.map(function(p){
   var c=p[st.lang],link=(tn&&p.tl)||p.l,how=(tn&&c[4])||c[3],icon=fieldIcon(p.ar[0]);
   return '<article class="card">'+(p.tn?'<span class="badge">✦ '+t.tn+'</span>':'')+
   '<div class="card-top"><span class="card-icon">'+icon+'</span><h2>'+c[0]+'</h2></div>'+
   '<p class="who">'+t.who+c[1]+'</p><p class="description">'+c[2]+'</p>'+
   '<p class="how">💬 '+how+'</p>'+
   (link?'<a class="go" href="'+link+'" target="_blank" rel="noopener noreferrer">'+t.go+' <span aria-hidden="true">↗</span></a>':'')+'</article>';
 }).join(""):'<div class="empty"><span class="empty-icon">🧭</span><strong>'+t.empty+'</strong></div>';
}
document.addEventListener("change",function(e){
 var n=e.target.name;if(n==="reg")st.reg=+e.target.value;else if(n==="lv")st.lv=+e.target.value;else if(n==="ar")st.ar=+e.target.value;else return;render();
});
$("search").addEventListener("input",function(e){st.search=e.target.value;render();var el=$("search");el.focus();el.setSelectionRange(st.search.length,st.search.length)});
function setLang(l){st.lang=l;try{localStorage.setItem("tv-lang",l)}catch(e){}render()}
$("bta").onclick=function(){setLang("ta")};$("ben").onclick=function(){setLang("en")};
$("reset").onclick=function(){st.reg=0;st.lv=2;st.ar=0;st.search="";render()};
render();
</script>
